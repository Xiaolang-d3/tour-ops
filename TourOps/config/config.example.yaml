database:
  host: localhost
  port: 3306
  user: root
  password: root
  name: TourOps

jwt:
  secret_key: your-secret-key-change-in-production
  algorithm: HS256
  expire_minutes: 1440  # 24小时

ai:
  # 通义千问 API 配置（阿里云百炼平台）
  # 1. 访问 https://bailian.console.aliyun.com/ 开通服务
  # 2. 前往 https://bailian.console.aliyun.com/#/api-key 创建 API Key
  # 3. 将 API Key 填入下方
  api_key: your-dashscope-api-key  # DashScope API Key
  model: qwen-plus  # 模型名称: qwen-turbo / qwen-plus / qwen-max
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1  # DashScope OpenAI兼容接口地址
